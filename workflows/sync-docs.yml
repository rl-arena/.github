name: Sync Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'api/**'
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force sync all documentation'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: sync-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-api-docs:
    name: Sync API Documentation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout docs repository
        uses: actions/checkout@v4
        with:
          repository: rl-arena/rl-arena-docs
          token: ${{ secrets.GITHUB_TOKEN }}
          path: docs
          
      - name: Checkout backend repository
        uses: actions/checkout@v4
        with:
          repository: rl-arena/rl-arena-backend
          path: backend
          
      - name: Setup cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache
            docs/.cache
          key: docs-sync-${{ runner.os }}-${{ hashFiles('**/go.sum', '**/package-lock.json') }}
          restore-keys: |
            docs-sync-${{ runner.os }}-
            
      - name: Copy API specifications
        id: copy-api
        run: |
          echo "Syncing API documentation..."
          
          # Create target directory if it doesn't exist
          mkdir -p docs/api
          
          # Copy OpenAPI spec
          if [ -f backend/api/openapi.yaml ]; then
            cp backend/api/openapi.yaml docs/api/openapi.yaml
            echo "api_changed=true" >> $GITHUB_OUTPUT
            echo "✅ Copied openapi.yaml" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ OpenAPI spec not found" >> $GITHUB_STEP_SUMMARY
            echo "api_changed=false" >> $GITHUB_OUTPUT
          fi
          
          # Copy additional API documentation
          if [ -d backend/docs/api ]; then
            cp -r backend/docs/api/* docs/api/
            echo "✅ Copied additional API docs" >> $GITHUB_STEP_SUMMARY
          fi
          
      - name: Check for API changes
        id: check-api-changes
        working-directory: docs
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No API documentation changes detected" >> $GITHUB_STEP_SUMMARY
          else
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "📝 API documentation changes detected" >> $GITHUB_STEP_SUMMARY
            git diff --cached --stat >> $GITHUB_STEP_SUMMARY
          fi
          
      - name: Create API docs PR
        if: steps.check-api-changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          path: docs
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            docs(api): sync API documentation from backend
            
            Synced from rl-arena-backend@${{ github.sha }}
          branch: sync/api-docs-${{ github.run_number }}
          delete-branch: true
          title: '🔄 Sync API Documentation'
          body: |
            ## 📚 API Documentation Sync
            
            This PR contains updated API documentation synced from the backend repository.
            
            ### Changes
            - Synced OpenAPI specification
            - Updated API reference documentation
            
            ### Source
            - Repository: `rl-arena/rl-arena-backend`
            - Commit: ${{ github.sha }}
            - Triggered by: @${{ github.actor }}
            
            ### Review Checklist
            - [ ] OpenAPI spec is valid
            - [ ] All endpoints are documented
            - [ ] Examples are up to date
            - [ ] Breaking changes are highlighted
            
            ---
            🤖 Auto-generated by sync-docs workflow
          labels: |
            documentation
            auto-sync
            api
          assignees: documentation-team
          reviewers: documentation-team

  sync-python-docs:
    name: Sync Python SDK Documentation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout docs repository
        uses: actions/checkout@v4
        with:
          repository: rl-arena/rl-arena-docs
          token: ${{ secrets.GITHUB_TOKEN }}
          path: docs
          
      - name: Checkout env repository
        uses: actions/checkout@v4
        with:
          repository: rl-arena/rl-arena-env
          path: env
          
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Install documentation tools
        run: |
          pip install pdoc3 mkdocs-material
          
      - name: Generate Python SDK docs
        id: generate-sdk
        run: |
          echo "Generating Python SDK documentation..."
          
          # Create target directory
          mkdir -p docs/sdk/python
          
          # Generate documentation from docstrings
          cd env
          pdoc --html --output-dir ../docs/sdk/python --force rl_arena
          
          echo "✅ Generated Python SDK documentation" >> $GITHUB_STEP_SUMMARY
          echo "sdk_generated=true" >> $GITHUB_OUTPUT
          
      - name: Copy additional SDK documentation
        run: |
          # Copy README and examples
          if [ -f env/README.md ]; then
            cp env/README.md docs/sdk/python/README.md
          fi
          
          if [ -d env/examples ]; then
            mkdir -p docs/sdk/python/examples
            cp -r env/examples/* docs/sdk/python/examples/
            echo "✅ Copied SDK examples" >> $GITHUB_STEP_SUMMARY
          fi
          
      - name: Check for SDK changes
        id: check-sdk-changes
        working-directory: docs
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No Python SDK documentation changes detected" >> $GITHUB_STEP_SUMMARY
          else
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "📝 Python SDK documentation changes detected" >> $GITHUB_STEP_SUMMARY
            git diff --cached --stat >> $GITHUB_STEP_SUMMARY
          fi
          
      - name: Create SDK docs PR
        if: steps.check-sdk-changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          path: docs
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            docs(sdk): sync Python SDK documentation
            
            Synced from rl-arena-env@${{ github.sha }}
          branch: sync/sdk-docs-${{ github.run_number }}
          delete-branch: true
          title: '🐍 Sync Python SDK Documentation'
          body: |
            ## 📚 Python SDK Documentation Sync
            
            This PR contains updated Python SDK documentation synced from the environment library.
            
            ### Changes
            - Generated API reference from docstrings
            - Updated SDK examples
            - Synced README documentation
            
            ### Source
            - Repository: `rl-arena/rl-arena-env`
            - Commit: ${{ github.sha }}
            - Triggered by: @${{ github.actor }}
            
            ### Review Checklist
            - [ ] All public APIs are documented
            - [ ] Examples run without errors
            - [ ] Installation instructions are current
            - [ ] Breaking changes are noted
            
            ---
            🤖 Auto-generated by sync-docs workflow
          labels: |
            documentation
            auto-sync
            python
            sdk
          assignees: documentation-team
          reviewers: documentation-team
          
  notify-completion:
    name: Notify Completion
    runs-on: ubuntu-latest
    needs: [sync-api-docs, sync-python-docs]
    if: always()
    
    steps:
      - name: Summary
        run: |
          echo "## 📋 Documentation Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| API Docs | ${{ needs.sync-api-docs.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python SDK Docs | ${{ needs.sync-python-docs.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✨ Sync completed at $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
